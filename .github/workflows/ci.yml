name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: build ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [relay_esp32, relay]
    steps:
      # The relay builds from the libraries of node-firmware, which must sit next to it.
      - uses: actions/checkout@v4
        with: { path: relay-firmware }
      - uses: actions/checkout@v4
        with: { repository: Terra-Watch/node-firmware, path: node-firmware }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('relay-firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
        working-directory: relay-firmware
